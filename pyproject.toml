[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qim"
version = "0.1.0"
description = "Quarantined Installation Monitor: run an install command in a crosvm guest and report what it did"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
qim = "qim.cli:main"

[tool.setuptools.packages.find]
include = ["qim*"]
