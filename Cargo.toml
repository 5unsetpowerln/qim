[package]
name = "qim"
version = "0.1.0"
edition = "2024"
description = "Quarantined Installation Monitor: run an install command in a crosvm guest and report what it did"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"

[profile.release]
codegen-units = 1
lto = true
